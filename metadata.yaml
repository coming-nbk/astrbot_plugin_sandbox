name: astrbot_plugin_sandbox
display_name: 沙盒终端
desc: 给 bot 一个隔离沙盒：按用户/群授权执行命令、导入宿主文件、WebUI 管文件、带安全体检与 CVE 巡检
version: v1.0.1
author: maid
license: AGPL-3.0
# 只声明「命令 + 文件导出」都靠得住的适配器。
# 命令本身在任何适配器都能跑（只用 plain_result），但导出文件依赖 File 组件，
# 有些平台发不了任意文件 —— 那种情况请把 export_as_file 关掉，改成回传宿主路径。
support_platforms:
  - aiocqhttp
  - telegram
  - discord
  - kook
repo: https://github.com/coming-nbk/astrbot_plugin_sandbox
logo: logo.png
